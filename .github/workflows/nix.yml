name: Build packages
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare source
        id: source
        run: bash packaging/nix/prepare-ci.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scroll-source
          path: dist/*.tar.gz
          if-no-files-found: error
  nix:
    name: Build Nix ${{ matrix.system }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: scroll-source
          path: dist
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, and export Nix closure
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_SYSTEM: ${{ matrix.system }}
        run: bash packaging/nix/build-ci.sh "$PWD/dist"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scroll-nix-${{ matrix.system }}
          path: |
            dist/*.nar.xz
            dist/*.store-path
            dist/SHA256SUMS-nix-*
          if-no-files-found: error
          retention-days: 30

  arch:
    name: Build Arch ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: lfdevs/archlinuxarm:base-devel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build and test Arch package
        env:
          ARCH_IMAGE: ${{ matrix.image }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e PACKAGE_ARCH -e BUILD_UID="$(id -u)" -e BUILD_GID="$(id -g)" \
            "$ARCH_IMAGE" bash packaging/arch-ci.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: scroll-arch-${{ matrix.arch }}
          path: |
            dist/*.pkg.tar.zst
            dist/*-linux-${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS-arch-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, nix, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: scroll-nix-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: scroll-arch-*
          path: dist
          merge-multiple: true
      - name: Publish package assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for sums in SHA256SUMS-*; do sha256sum -c "$sums"; done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.nar.xz ./*.store-path ./*.pkg.tar.zst ./*-linux-*.tar.gz SHA256SUMS-* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "Scroll ${RELEASE_TAG#v}" ./*.nar.xz ./*.store-path ./*.pkg.tar.zst ./*-linux-*.tar.gz SHA256SUMS-*
          fi
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$verify_dir" --pattern '*nix-*' --pattern '*.pkg.tar.zst' --pattern '*-linux-*.tar.gz' --pattern 'SHA256SUMS-*'
          for sums in SHA256SUMS-*; do cmp "$sums" "$verify_dir/$sums"; done
          cd "$verify_dir"
          for sums in SHA256SUMS-*; do sha256sum -c "$sums"; done
